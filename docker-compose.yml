services:
  app:
    image: ghcr.io/ruscalworld/todo-api-bsbo:main
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/postgres
      SECRET_KEY: changeme

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '5432:5432'

  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres-data:
